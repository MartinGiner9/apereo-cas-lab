# -----------------------------------------------------------------------------
# Apereo CAS Lab configuration
# -----------------------------------------------------------------------------
# This file contains only configuration owned by this project. Keep upstream
# overlay/build files separate so CAS upgrades remain reviewable.

# CAS public URLs
cas.server.name=${CAS_SERVER_NAME:https://localhost:8443}
cas.server.prefix=${CAS_SERVER_PREFIX:https://localhost:8443/cas}

# Disable the built-in casuser/Mellon demo authentication handler.
cas.authn.accept.enabled=false

# Explicit JSON service registry. Do not enable catch-all services.
cas.service-registry.json.location=file:/etc/cas/services
cas.service-registry.core.init-default-services=false

# JDBC authentication against the lab PostgreSQL identity store.
cas.authn.jdbc.query[0].sql=SELECT username, password_hash, email, display_name FROM cas_user WHERE username=? AND enabled=true
cas.authn.jdbc.query[0].url=${CAS_DB_URL:jdbc:postgresql://postgres:5432/cas}
cas.authn.jdbc.query[0].user=${CAS_DB_USER:cas}
cas.authn.jdbc.query[0].password=${CAS_DB_PASSWORD:change-me-local-only}
cas.authn.jdbc.query[0].driver-class=org.postgresql.Driver
cas.authn.jdbc.query[0].field-password=password_hash
cas.authn.jdbc.query[0].password-encoder.type=BCRYPT
cas.authn.jdbc.query[0].password-encoder.strength=12
cas.authn.jdbc.query[0].principal-attribute-list=email,display_name
cas.authn.jdbc.query[0].pool.min-size=1
cas.authn.jdbc.query[0].pool.max-size=5
